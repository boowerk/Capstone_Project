; =========================================================================
; 네트워크 / 데디 서버 틱레이트
; 에디터 PIE는 listen 서버가 에디터 프레임레이트로 돌아 위치 복제가 잦지만,
; 데디 서버는 NetServerMaxTickRate 기본값 30Hz로 캡되어 캐릭터 이동이 계단식(끊김)으로 보인다.
; 서버 시뮬레이션/복제 빈도를 60Hz로 올리고, rate(대역폭) 캡도 함께 상향해 보정 튐을 줄인다.
; 주의: 이 설정은 쿡 시 패키지에 스테이징되므로 변경 후 CookDevServer.bat 재실행 필요.
; =========================================================================
[/Script/OnlineSubsystemUtils.IpNetDriver]
